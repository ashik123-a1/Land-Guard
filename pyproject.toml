[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "landguard-ai-evaluation"
version = "0.1.0"
description = "Synthetic Data, Document Generation, and AI Evaluation Benchmark for LandGuard"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LandGuard AI Research Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.19.0",
    "matplotlib>=3.7.0",
    "pytest>=7.4.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pymupdf>=1.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
