{% extends "user/layout.html" %}

{% block title %}Settings — LandGuard AI{% endblock %}

{% block portal_content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Portal Preferences</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">Configure language, notifications, and verification alerts.</p>
    </div>

    <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-6">
        <div>
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Display &amp; Language</h3>
            <div class="grid grid-cols-2 gap-3 max-w-sm">
                <label class="p-3 rounded-xl border border-cyan-500/50 bg-cyan-950/20 flex items-center justify-between cursor-pointer">
                    <div>
                        <div class="text-xs font-bold text-white">English</div>
                        <div class="text-[10px] text-slate-400">Primary Technical</div>
                    </div>
                    <input type="radio" name="lang" value="en" checked class="text-cyan-500 focus:ring-cyan-500">
                </label>
                <label class="p-3 rounded-xl border border-slate-800 bg-slate-900/40 flex items-center justify-between cursor-pointer hover:border-slate-700">
                    <div>
                        <div class="text-xs font-bold text-white">বাংলা</div>
                        <div class="text-[10px] text-slate-400">Bengali Script</div>
                    </div>
                    <input type="radio" name="lang" value="bn" class="text-cyan-500 focus:ring-cyan-500">
                </label>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-800">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Notification Preferences</h3>
            <div class="space-y-3">
                <label class="flex items-center justify-between p-3 rounded-xl bg-slate-900/40 border border-slate-800 cursor-pointer">
                    <div>
                        <div class="text-xs font-bold text-white">Verification Completed Alerts</div>
                        <div class="text-[11px] text-slate-400">Receive instant notice when statutory rules and OCR finishes</div>
                    </div>
                    <input type="checkbox" checked class="rounded bg-navy-900 border-slate-700 text-cyan-500 focus:ring-cyan-500">
                </label>
                <label class="flex items-center justify-between p-3 rounded-xl bg-slate-900/40 border border-slate-800 cursor-pointer">
                    <div>
                        <div class="text-xs font-bold text-white">Investigator Case Progress</div>
                        <div class="text-[11px] text-slate-400">Receive alert when an officer updates notes or approves expedite</div>
                    </div>
                    <input type="checkbox" checked class="rounded bg-navy-900 border-slate-700 text-cyan-500 focus:ring-cyan-500">
                </label>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-800 flex justify-end">
            <button type="button" onclick="showToast('Preferences saved successfully', 'success')" class="px-5 py-2 rounded-xl text-xs font-semibold text-navy-950 bg-cyan-400 hover:bg-cyan-300 transition-colors">
                Save Preferences
            </button>
        </div>
    </div>
</div>
{% endblock %}
