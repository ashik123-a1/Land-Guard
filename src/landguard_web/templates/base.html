<!DOCTYPE html>
<html lang="{{ current_lang or 'bn' }}" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LandGuard AI{% endblock %}</title>
    <!-- LandGuard Browser Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/images/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/static/images/favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            950: '#070b16',
                            900: '#0b132b',
                            850: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                        },
                        cyan: {
                            400: '#38bdf8',
                            500: '#06b6d4',
                            600: '#0891b2',
                        },
                        indigo: {
                            500: '#6366f1',
                            600: '#4f46e5',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Bengali', 'Hind Siliguri', 'Nirmala UI', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter, JetBrains Mono, Orbitron, Noto Sans Bengali, Hind Siliguri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Bengali:wght@300;400;500;600;700;800&family=Orbitron:wght@700;800;900;950&display=swap" rel="stylesheet">
    <!-- LandGuard Unified Theme Tokens & Motion -->
    <link rel="stylesheet" href="/static/css/theme.css?v=20261018-01">

    <style>
        body {
            font-family: 'Inter', 'Noto Sans Bengali', 'Hind Siliguri', 'Nirmala UI', sans-serif;
            background-color: #070b16;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-panel-glow {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.12);
        }

        .glass-input {
            background: rgba(11, 19, 43, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.25);
            background: rgba(15, 23, 42, 0.95);
        }

        /* Bank-card-inspired LandGuard Identity Card */
        .identity-card {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1.586 / 1;
            border-radius: 1.25rem;
            position: relative;
            background: linear-gradient(135deg, #0b132b 0%, #1e1b4b 50%, #082f49 100%);
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(6, 182, 212, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
            color: #ffffff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .identity-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 35px rgba(6, 182, 212, 0.35);
        }
        .identity-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 60%);
            pointer-events: none;
        }
        .chip-icon {
            width: 44px;
            height: 34px;
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa771c 100%);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }
        .chip-icon::after {
            content: '';
            position: absolute;
            top: 25%;
            left: 20%;
            right: 20%;
            bottom: 25%;
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 2px;
        }

        /* 3D Flippable Smart NID Identity Card */
        .id-card-3d-wrapper {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1.586 / 1;
            perspective: 1200px;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease;
        }
        .id-card-3d-wrapper:hover {
            transform: translateY(-4px) scale(1.01);
        }
        .id-card-3d-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.65s cubic-bezier(0.4, 0.0, 0.2, 1);
            border-radius: 1.25rem;
        }
        .id-card-3d-inner.flipped {
            transform: rotateY(180deg);
        }
        .id-card-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
            overflow: hidden;
        }
        .id-card-front {
            z-index: 2;
            transform: rotateY(0deg);
        }
        .id-card-back {
            transform: rotateY(180deg);
            z-index: 1;
        }
        .id-card-front .identity-card {
            height: 100%;
            max-width: 100%;
            box-shadow: none;
            transition: none;
            transform: none !important;
            padding: 1.15rem 1.35rem;
        }
        .identity-card-back {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0b132b 0%, #1e1b4b 50%, #082f49 100%);
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(6, 182, 212, 0.2);
            border-radius: 1.25rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.15rem 1.35rem;
            color: #ffffff;
            position: relative;
        }
        .identity-card-back::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Subtle scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #070b16;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }

        /* Animations */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.6)); }
        }
        .pulse-glow {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-navy-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
    <!-- Main Content Slot -->
    <div class="flex-1 flex flex-col">
        {% block content %}{% endblock %}
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <script>
        // Initialize Lucide Icons
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });

        // Global Toast Notification Helper
        function clearToasts() {
            const container = document.getElementById('toast-container');
            if (container) container.innerHTML = '';
        }

        function showToast(message, type = 'info', duration = 4000) {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-xl backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 text-sm font-medium ${
                type === 'success' ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200' :
                type === 'error' ? 'bg-rose-950/90 border-rose-500/50 text-rose-200' :
                type === 'warning' ? 'bg-amber-950/90 border-amber-500/50 text-amber-200' :
                'bg-slate-900/90 border-cyan-500/50 text-cyan-200'
            }`;

            toast.innerHTML = `
                <div class="shrink-0">
                    ${type === 'success' ? '<i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>' :
                      type === 'error' ? '<i data-lucide="alert-octagon" class="w-4 h-4 text-rose-400"></i>' :
                      type === 'warning' ? '<i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400"></i>' :
                      '<i data-lucide="info" class="w-4 h-4 text-cyan-400"></i>'}
                </div>
                <div class="flex-1">${message}</div>
            `;
            container.appendChild(toast);
            if (window.lucide) window.lucide.createIcons();

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // Global Language Preference Switcher
        async function setLanguagePreference(lang) {
            try {
                await fetch('/api/user/preferences', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ preferred_language: lang })
                });
            } catch (err) {
                console.warn("Could not save preference via API:", err);
            }
            document.cookie = `landguard_lang=${lang};path=/;max-age=31536000;SameSite=Lax`;
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.location.href = url.toString();
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
