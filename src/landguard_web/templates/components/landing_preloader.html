<!-- ==============================================================================
     LANDGUARD INTRO FULLSCREEN LEAFLET SPLASH PRELOADER COMPONENT
     Choreography & Requirements:
     1. FULLSCREEN (No box / no container frame — map fills 100vw x 100vh)
     2. Top Logo is 100% TRANSPARENT with NO BORDER ("transparant hobe kono border hobe nh")
     3. Southern delta / Sundarbans tracing is brisk and faster ("nicher diker dag gula halka aktu fast")
     4. NO bottom loading bar or bottom text
     5. Starts with deep black/dark canvas across entire screen
     6. High-Res Bangladesh border traces smoothly
     7. All 8 divisions ignite simultaneously (Clean radar pulse waves, NO text clutter)
     8. Map tiles & illuminated cadastral fill fade in progressively
     9. Smooth 60fps fade-out opening the main landing page
     ============================================================================== -->

<div id="landguard-preloader" style="position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 99999; background: #060a14; overflow: hidden; opacity: 1; transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);">

  <style>
    #landguard-preloader.fade-out {
      opacity: 0 !important;
      transform: scale(1.02) !important;
      pointer-events: none !important;
    }

    /* Fullscreen Leaflet Map */
    #preloader-leaflet-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #060a14 !important;
      z-index: 1;
    }

    /* Top Floating Cyber Brand (100% TRANSPARENT, NO BORDER, NO BOX) */
    .lg-preloader-brand-hud {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
    }

    .lg-preloader-brand {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', -apple-system, sans-serif;
      user-select: none;
    }
    .lg-preloader-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
    }
    .lg-preloader-word-land {
      justify-self: end;
      margin-right: 14px;
    }
    .lg-preloader-shield {
      justify-self: center;
    }
    .lg-preloader-word-guard {
      justify-self: start;
      margin-left: 14px;
    }
    .lg-preloader-shield {
      width: 50px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      filter: drop-shadow(0 0 18px rgba(34, 211, 238, 0.65));
    }
    .lg-preloader-orbit {
      animation: lgPreloaderOrbit 8s linear infinite;
      transform-origin: 50px 55px;
      transform-box: view-box;
    }
    @keyframes lgPreloaderOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .lg-preloader-laser {
      animation: lgPreloaderLaser 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes lgPreloaderLaser {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 1; }
      60% { transform: translateY(62px); opacity: 0.9; }
      75% { opacity: 0.2; }
      100% { transform: translateY(0px); opacity: 0; }
    }
    .lg-preloader-blink {
      animation: lgPreloaderBlink 2s infinite ease-in-out alternate;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes lgPreloaderBlink {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
    .lg-preloader-badge {
      animation: lgPreloaderBadgeBeat 2.4s ease-in-out infinite;
      transform-origin: 65px 46px;
      transform-box: view-box;
    }
    @keyframes lgPreloaderBadgeBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); filter: drop-shadow(0 0 8px #34D399); }
    }
    .lg-preloader-word {
      font-size: 24px;
      font-weight: 950;
      letter-spacing: 5px;
      line-height: 1;
      position: relative;
      display: inline-block;
      font-family: 'Orbitron', -apple-system, sans-serif;
      transform: scaleX(1.08) scaleY(0.90);
    }
    .lg-preloader-word-land {
      color: rgba(52, 211, 153, 0.15);
      -webkit-text-stroke: 1.3px #34D399;
    }
    .lg-preloader-word-guard {
      color: rgba(34, 211, 238, 0.15);
      -webkit-text-stroke: 1.3px #22D3EE;
    }
    .lg-preloader-fill-land,
    .lg-preloader-word-land::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      -webkit-text-stroke: 0px;
      color: #34D399;
      -webkit-text-fill-color: #34D399;
      overflow: hidden;
      animation: lgPreloaderLandFill 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .lg-preloader-fill-guard,
    .lg-preloader-word-guard::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      -webkit-text-stroke: 0px;
      color: #22D3EE;
      -webkit-text-fill-color: #22D3EE;
      overflow: hidden;
      animation: lgPreloaderGuardFill 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes lgPreloaderLandFill {
      0% { clip-path: inset(100% 0 0 0); }
      42% { clip-path: inset(0% 0 0 0); filter: drop-shadow(0 0 16px #34D399); }
      86% { clip-path: inset(0% 0 0 0); }
      100% { clip-path: inset(100% 0 0 0); }
    }
    @keyframes lgPreloaderGuardFill {
      0% { clip-path: inset(100% 0 0 0); }
      42% { clip-path: inset(0% 0 0 0); filter: drop-shadow(0 0 16px #22D3EE); }
      86% { clip-path: inset(0% 0 0 0); }
      100% { clip-path: inset(100% 0 0 0); }
    }

    /* Cyber Platform Wings */
    .lg-preloader-platform {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      position: relative;
    }
    .lg-preloader-wing {
      flex: 1;
      height: 2px;
      position: relative;
      overflow: hidden;
    }
    .lg-preloader-wing-left { background: linear-gradient(to right, transparent, rgba(52, 211, 153, 0.4), #34D399); }
    .lg-preloader-wing-right { background: linear-gradient(to right, #22D3EE, rgba(34, 211, 238, 0.4), transparent); }
    .lg-preloader-wing::after {
      content: '';
      position: absolute;
      top: 0;
      width: 32px;
      height: 100%;
      background: linear-gradient(90deg, transparent, #FFFFFF, transparent);
      filter: drop-shadow(0 0 6px #22D3EE);
      animation: lgPreloaderLaserStream 2.5s infinite linear;
    }
    .lg-preloader-wing-left::after { right: 0; animation-direction: reverse; }
    .lg-preloader-wing-right::after { left: 0; }
    @keyframes lgPreloaderLaserStream {
      0% { transform: translateX(-100%); opacity: 0; }
      100% { transform: translateX(350%); opacity: 0; }
    }
    .lg-preloader-keyhole {
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.6));
    }
    .lg-preloader-subtext {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 5px;
      color: #94A3B8;
      margin-top: 3px;
      text-align: center;
      transform: scaleX(1.06) scaleY(0.90);
    }

    /* Radar Pulse Pins for 8 Divisions (Clean & Clutter-Free, NO text labels) */
    .radar-pin-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radar-pulse-ring {
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(6, 182, 212, 0.45);
      animation: preloaderRadarPing 2.0s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .radar-pulse-ring-pilot {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.5);
      animation: preloaderRadarPing 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes preloaderRadarPing {
      0% { transform: scale(0.6); opacity: 0.95; }
      80%, 100% { transform: scale(2.8); opacity: 0; }
    }
    .radar-core-dot {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #22d3ee;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 14px #06b6d4;
    }
    .radar-core-dot-pilot {
      position: relative;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f59e0b;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 16px #f59e0b;
    }

    /* Laser Tracer Head */
    .tracer-head-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid #10b981;
      box-shadow: 0 0 18px #10b981, 0 0 28px #22d3ee;
    }
  </style>

  <!-- Top Skip Button -->
  <div class="absolute top-6 right-8 z-50">
    <button type="button" onclick="dismissLandGuardPreloader()" class="px-4 py-1.5 rounded-full text-xs font-mono text-slate-300 hover:text-cyan-300 bg-slate-900/80 hover:bg-slate-800 border border-slate-700/70 transition-all flex items-center gap-1.5 backdrop-blur-md shadow-lg cursor-pointer">
      <span>{{ _('Skip Intro') if current_lang != 'bn' else 'স্কিপ করুন' }}</span>
      <span class="text-cyan-400 font-bold">&rarr;</span>
    </button>
  </div>

  <!-- Top Floating Cyber HUD Logo (100% Transparent, No Border) -->
  <div class="lg-preloader-brand-hud">
    <div class="lg-preloader-brand">
      <div class="lg-preloader-row">
        <div class="lg-preloader-word lg-preloader-word-land" data-text="LAND">
          LAND
          <span class="lg-preloader-fill-land">LAND</span>
        </div>

        <div class="lg-preloader-shield">
          <svg class="w-full h-full" viewBox="0 0 100 110" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="shieldCenterBgPreloader" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0F172A"/>
                <stop offset="50%" stop-color="#0A221C"/>
                <stop offset="100%" stop-color="#02150F"/>
              </linearGradient>
              <linearGradient id="neonCyanCenterPreloader" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#22D3EE"/>
                <stop offset="100%" stop-color="#06B6D4"/>
              </linearGradient>
              <linearGradient id="greenParcelGradPreloader" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#065F46"/>

            <!-- Main Shield Frame -->
            <path d="M50 7 C73 16 87 19 89 28 C89 67 55 93 50 101 C45 93 11 67 11 28 C13 19 27 16 50 7 Z"

            <!-- Interior Cyber Grid -->
            <g stroke="#1E293B" stroke-width="1" opacity="0.8">
              <line x1="22" y1="28" x2="78" y2="28" />
              <line x1="18" y1="42" x2="82" y2="42" />
              <line x1="18" y1="56" x2="82" y2="56" />
              <line x1="50" y1="10" x2="50" y2="60" stroke="#22D3EE" stroke-width="1.2" opacity="0.6"/>

            <!-- Vertical Scanning Laser -->
            <line class="lg-preloader-laser" x1="16" y1="20" x2="84" y2="20" stroke="#34D399" stroke-width="2" filter="url(#centerGlowPreloader)"/>

            <!-- Circuit Traces & Nodes -->
            <g stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round">
              <path d="M20 38 H32 L38 46" fill="none" opacity="0.85"/>

              <rect x="0" y="0" width="26" height="32" rx="3" fill="#061A14" stroke="#34D399" stroke-width="1.8"/>
              <line x1="5" y1="8" x2="21" y2="8" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>

              <circle class="lg-preloader-badge" cx="22" cy="24" r="5.5" fill="#34D399" filter="url(#centerGlowPreloader)"/>

              <path d="M50 58 L50 95 M15 74 L85 74" stroke="#0F172A" stroke-width="1.5"/>
            </g>
          </svg>
        </div>

        <div class="lg-preloader-word lg-preloader-word-guard" data-text="GUARD">
          GUARD
          <span class="lg-preloader-fill-guard">GUARD</span>
        </div>
      </div>

      <!-- Cyber Platform Wings -->
      <div class="lg-preloader-platform">
        <div class="lg-preloader-wing lg-preloader-wing-left"></div>
        <div class="lg-preloader-keyhole">
          <svg width="20" height="15" viewBox="0 0 24 20" fill="none">
            <path d="M12 2 L20 6 V12 C20 16 12 19 12 19 C12 19 4 16 4 12 V6 L12 2 Z" stroke="#22D3EE" stroke-width="1.8" fill="#0A111E"/>
            <circle cx="12" cy="9" r="2" fill="#22D3EE"/>

          </svg>
        </div>
        <div class="lg-preloader-wing lg-preloader-wing-right"></div>
      </div>

      <div class="lg-preloader-subtext">SECURE DIGITAL CADASTRE</div>
    </div>
  </div>

  <!-- FULLSCREEN LEAFLET MAP CONTAINER (No box / No borders / Full Viewport) -->
  <div id="preloader-leaflet-map"></div>

</div>

<script>
  function dismissLandGuardPreloader() {
    const preloader = document.getElementById('landguard-preloader');
    if (preloader) {
      preloader.classList.add('fade-out');
      setTimeout(() => {
        if (preloader.parentNode) {
          preloader.parentNode.removeChild(preloader);
        }
      }, 700);
    }
  }

  // Fullscreen Preloader Orchestration

            const markerIcon = L.divIcon({
              className: 'custom-radar-icon',
              html: `
                <div class="radar-pin-container">
                  <div class="${isP ? 'radar-pulse-ring-pilot' : 'radar-pulse-ring'}"></div>
                  <div class="${isP ? 'radar-core-dot-pilot' : 'radar-core-dot'}"></div>
                </div>
              `,
              iconSize: [38, 38],
              iconAnchor: [19, 19]
            });
            L.marker([div.lat, div.lng], { icon: markerIcon }).addTo(pMap);
          });
        }

        const mapElapsed = elapsed - (TRACE_DURATION + IGNITE_DURATION);
        const mapRatio = Math.min(1.0, mapElapsed / MAP_REVEAL_DURATION);

        // Fade in actual ArcGIS dark map tiles
        tileBase.setOpacity(mapRatio * 1.0);
        tileRef.setOpacity(mapRatio * 0.85);

        // Fade in luminous cyan polygon fill with emerald boundary
        if (!mapRevealed) {
          mapRevealed = true;
          fullPolygon = L.polygon(BD_ACCURATE_BORDER_POINTS, {
            color: '#10B981',
            weight: 2.8,
            opacity: 0.95,
            fillColor: '#06B6D4',
            fillOpacity: mapRatio * 0.22,
            dashArray: '3, 4'
          }).addTo(pMap);

          if (tracePolyline) {
            pMap.removeLayer(tracePolyline);
          }
        } else if (fullPolygon) {
          fullPolygon.setStyle({
            fillOpacity: Math.min(0.22, mapRatio * 0.22)
          });
        }
      }
      // PHASE 4: Fully Illuminated Real Map
      else if (elapsed >= TOTAL_DURATION) {
        tileBase.setOpacity(1.0);
        tileRef.setOpacity(0.85);
        if (fullPolygon) {
          fullPolygon.setStyle({ fillOpacity: 0.22 });
        }
      }
    }

    // Expose programmatic renderer for GIF/video frame recorder
    window.renderPreloaderFrame = function(customElapsed) {
      window.RECORDING_MODE = true;
      updatePreloaderState(customElapsed);
    };

    function frame(now) {
      if (window.RECORDING_MODE) return;
      const elapsed = now - startTime;
      updatePreloaderState(elapsed);

      if (elapsed >= TOTAL_DURATION) {
        if (!window.DISABLE_PRELOADER_DISMISS) {
          setTimeout(() => {
            dismissLandGuardPreloader();
          }, 300);
        }
        return;
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  });
</script>
