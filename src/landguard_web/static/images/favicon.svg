<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">
  <defs>
    <linearGradient id="lgShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728"/>
      <stop offset="50%" stop-color="#06221c"/>
      <stop offset="100%" stop-color="#02140e"/>
    </linearGradient>
    <linearGradient id="lgCyanStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lgGreenDeed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="lgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#22d3ee" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shield Frame with Glow -->
  <path d="M50 6 C74 15 88 18 90 28 C90 69 55 96 50 104 C45 96 10 69 10 28 C12 18 26 15 50 6 Z"
        fill="url(#lgShieldBg)" stroke="url(#lgCyanStroke)" stroke-width="4.5" stroke-linejoin="round" filter="url(#lgGlow)"/>

  <!-- Interior Subtle Cyber Grid -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.8">
    <line x1="20" y1="30" x2="80" y2="30"/>
    <line x1="16" y1="46" x2="84" y2="46"/>
    <line x1="18" y1="62" x2="82" y2="62"/>
    <line x1="50" y1="10" x2="50" y2="65" stroke="#22d3ee" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Circuit Trace Nodes -->
  <g stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round">
    <path d="M19 40 H30 L36 48" fill="none" opacity="0.9"/>
    <circle cx="19" cy="40" r="2.8" fill="#22d3ee"/>
    <circle cx="36" cy="48" r="2.8" fill="#34d399"/>
  </g>

  <!-- Central Smart Land Deed -->
  <g transform="translate(42, 23)">
    <rect x="0" y="0" width="28" height="36" rx="4" fill="url(#lgGreenDeed)" stroke="#34d399" stroke-width="2.5"/>
    <line x1="5" y1="9" x2="23" y2="9" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="5" y1="16" x2="19" y2="16" stroke="#6ee7b7" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="5" y1="23" x2="15" y2="23" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Verified Badge -->
    <circle cx="23" cy="27" r="7" fill="#34d399" stroke="#064e3b" stroke-width="1.2"/>
    <path d="M20 27 L22.2 29.2 L26.2 24.8" stroke="#022c22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
