# ==============================================================================
# LandGuard AI — Standby Cloud Deployment Specification (Legacy / Reference Only)
# ==============================================================================
# NOTE: The primary, active judging deployment is hosted on GitHub Codespaces:
#   https://expert-engine-gx6rj5vp5xprcwr44-8000.app.github.dev/
# This Render blueprint is preserved strictly as an optional standby configuration.
# ==============================================================================

services:
  - type: web
    name: landguard-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/init_persistent_db.py && uvicorn src.landguard_web.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    disk:
      name: landguard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_BACKEND
        value: SQLITE
      - key: LANDGUARD_DB_PATH
        value: /var/data/landguard_operational.db
      - key: LANDGUARD_UPLOADS_PATH
        value: /var/data/uploads
      - key: ALLOW_DEMO_LOGIN_IN_PROD
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LANDGUARD_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
