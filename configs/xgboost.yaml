# XGBoost Fraud-Risk Benchmark Model Configuration
seed: 42

params:
  n_estimators: 250
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.85
  colsample_bytree: 0.85
  scale_pos_weight: 1.0
  eval_metric: "logloss"
  objective: "binary:logistic"
  random_state: 42

early_stopping_rounds: 25

baseline_models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    random_state: 42
  random_forest:
    n_estimators: 200
    max_depth: 10
    random_state: 42
